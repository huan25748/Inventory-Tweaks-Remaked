plugins {
    id 'net.fabricmc.fabric-loom-remap' version "1.20.0-alpha.32"
    id 'maven-publish'
}

base {
    archivesName = "inventorytweaksremaked-fabric-26.3"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "inventorytweaksremaked" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    mappings loom.layered {
        mappings file("mappings/identity.tiny")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.167.0+26.3"
}

sourceSets {
    client {
        java {
            srcDir "../common/src/main/java"
            srcDir "../fabric-263/src/client/java"
        }
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
